<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreamaru</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #111111;
    --muted: #666666;
    --border: #e5e5e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0d;
      --fg: #f2f2f2;
      --muted: #9a9a9a;
      --border: #2a2a2a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 480px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 32px;
  }
  .brand img {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: block;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--border);
  }
  li {
    border-bottom: 1px solid var(--border);
  }
  a.project {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 16px 4px;
    text-decoration: none;
    color: inherit;
  }
  a.project:hover {
    color: #5b8def;
  }
  .project-name {
    font-weight: 600;
  }
  .project-desc {
    font-size: 0.85rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="images/logo.png" alt="Dreamaru 로고">
    <h1>Dreamaru</h1>
  </div>
  <ul>
    <li>
      <a class="project" href="https://gy-sheep.github.io/Dreamaru/">
        <span class="project-name">Dreamaru 프로젝트 소개</span>
        <span class="project-desc">서비스 소개 바로가기</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
